name: Deploy to GitHub Pages

# 把 public/ 作为静态站点发布到 GitHub Pages。
# 发布前会先跑一遍 tools/build-demo.mjs：把 server/ 下的后端代码打包进浏览器，
# 使注册登录、报价管理、15 项 AI 造价能力在纯静态环境下依然可用。
#
# 前置条件（一次性，手动）：仓库 Settings > Pages > Source 选择「GitHub Actions」。
# 说明：无法由 workflow 自动创建 Pages 站点（默认 GITHUB_TOKEN 无该权限，会 403），
# 必须先在 Settings 里启用 Pages；此后每次 push 到 main 均自动构建并发布。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 构建静态演示版
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v5

      - name: 准备 Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: 生成浏览器端数据层
        run: node tools/build-demo.mjs

      - name: 接口层自测（浏览器包跑通全部接口）
        run: node tools/test-demo.mjs

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 打包站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    name: 发布
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 Pages
        id: deployment
        uses: actions/deploy-pages@v4
